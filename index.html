<!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Capture Photo</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          max-width: 600px;
          margin: 0 auto;
          padding: 20px;
          text-align: center;
        }
        #camera {
          width: 100%;
          background: #eee;
          margin: 20px 0;
        }
        video {
          width: 100%;
        }
        canvas {
          display: none;
        }
        button {
          padding: 10px 20px;
          margin: 5px;
          background: #4285f4;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        }
        #result {
          margin-top: 20px;
          color: green;
        }
      </style>
    </head>
    <body>
      <h1>Capture Photo</h1>
      <div id="camera">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
      </div>
      <button id="capture">Prendre une photo</button>
      <button id="retake" disabled>Reprendre</button>
      <button id="upload" disabled>Envoyer</button>
      <div id="result"></div>

      <script src="app.js"></script>
    </body>
    </html>
